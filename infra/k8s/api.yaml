# API:t i k3s. IMAGE_PLACEHOLDER byts mot ghcr.io/riftstats-1/riftstats-api:<commit-sha> i pipelinen.
apiVersion: v1
kind: Namespace
metadata:
  name: riftstats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: riftstats
  labels: { app: api }
spec:
  # Inget "replicas" här: HPA:n bestämmer antalet. Annars skulle varje deploy
  # återställa antalet podar mitt under en autoscaling.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # ta aldrig bort en gammal pod förrän en ny är redo
      maxSurge: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MODE
              value: api
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: info
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: riftstats
            - name: PGDATABASE
              value: riftstats
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              # Ge load balancern tid att sluta skicka trafik innan podden stängs
              exec:
                command: ["sleep", "5"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher
  namespace: riftstats
  labels: { app: fetcher }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: fetcher }
  template:
    metadata:
      labels: { app: fetcher }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fetcher
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MODE
              value: fetcher
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: info
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: riftstats
            - name: PGDATABASE
              value: riftstats
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: RIOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: riot-api-key
                  key: key
            - name: RIOT_RATE_PER_SEC
              value: "18"
            - name: RIOT_RATE_PER_2MIN
              value: "90"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: riftstats
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: riftstats
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [api.riftstats.se]
      secretName: api-tls
  rules:
    - host: api.riftstats.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: riftstats
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: riftstats
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
