# Postgres i klustret. Lösenordet ligger i secreten "postgres-credentials",
# som skapas manuellt på servern och aldrig checkas in.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: riftstats
  labels: { app: postgres }
spec:
  clusterIP: None   # headless: podden nås som postgres.riftstats.svc.cluster.local
  selector: { app: postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: riftstats
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: riftstats
            - name: POSTGRES_USER
              value: riftstats
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "riftstats", "-d", "riftstats"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "riftstats", "-d", "riftstats"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
