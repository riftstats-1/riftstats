name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Kör aldrig två deployer samtidigt
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/riftstats-1/riftstats-api
  API_URL: https://api.riftstats.se

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build and push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Apply manifests and wait for rollout
        env:
          TARGET: deploy@${{ secrets.SSH_HOST }}
        run: |
          {
            sed "s|IMAGE_PLACEHOLDER|${IMAGE}:${GITHUB_SHA}|" infra/k8s/api.yaml
            echo '---'
            cat infra/k8s/postgres.yaml
            echo '---'
            cat infra/k8s/backup.yaml
          } | ssh "$TARGET" 'export KUBECONFIG=$HOME/.kube/config
                kubectl apply -f - &&
                kubectl -n riftstats rollout status deployment/api --timeout=180s'

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$API_URL/health"

      - name: Roll back on failure
        if: failure()
        env:
          TARGET: deploy@${{ secrets.SSH_HOST }}
        run: |
          ssh "$TARGET" 'export KUBECONFIG=$HOME/.kube/config
              kubectl -n riftstats rollout undo deployment/api'
