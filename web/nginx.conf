# Two sites in one nginx:
#   riftstats.se / www.riftstats.se  -> download page (web/site)
#   cdn.riftstats.se                 -> static files: assets and the installer (web/cdn)
# TLS is terminated by Traefik in front of this pod, so nginx only listens on plain HTTP.

server {
    listen 80;
    server_name riftstats.se www.riftstats.se;
    root /usr/share/nginx/site;

    # Riot's domain verification file for the production API key.
    location = /riot.txt {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    server_name cdn.riftstats.se;
    root /usr/share/nginx/cdn;

    # Note: add_header in a location replaces the server's headers, so CORS is repeated per location.

    # Stylesheets, logo and other assets: cacheable for a day.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Installer and latest.json: always check for a newer version.
    location /downloads/ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = / {
        return 302 https://riftstats.se/;
    }
}

# Kubernetes probes call the pod IP directly, so they land here.
server {
    listen 80 default_server;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
